<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 Finances privées</title>

<script>
let financeType = "";
const CODE_SECRET = "2019";

const code = prompt("🔒 Entrez le code d'accès");

if (code !== CODE_SECRET) {
    alert("⛔ Accès refusé");
    window.location.replace("index.html");
    throw new Error("Accès refusé");
}

</script>

<style>

body{
  font-family:Arial,sans-serif;
  background:#f3e5f5;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.btn-retour{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#9C27B0;
  color:white;
  font-weight:bold;
  margin-bottom:20px;
  cursor:pointer;
}
  .btn-finance-plus{
  display:block;
  width:100%;
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#4CAF50;
  color:white;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.btn-finance-moins{
  display:block;
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#E53935;
  color:white;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}  

h1{
  text-align:center;
  color:#9C27B0;
}

</style>

</head>
<body>

<button class="btn-retour" onclick="history.back()">
⬅ Retour
</button>

<h1>💰 Finances privées</h1>

<div class="card">

  <h2>💰 Frais mensualisés</h2>

  <p>
    <strong>Total annuel :</strong><br>
    <span id="totalAnnuel">...</span>
  </p>

  <br>

  <p>
    <strong>À mettre de côté chaque mois :</strong><br>
    <span id="totalMensuel">...</span>
  </p>

</div>

<br>

<div class="card">

  <h2>🌴 Épargne vacances</h2>

  <p>
    <strong>Solde actuel :</strong><br>
    <span id="soldeVacances">...</span>
  </p>

  <br>

  <p>
    <strong>Total des apports :</strong><br>
    <span id="totalApports">...</span>
  </p>

  <br>

  <p>
    <strong>Total des dépenses :</strong><br>
    <span id="totalDepenses">...</span>
  </p>

  <button class="btn-finance-plus"
          onclick="ajouterApport()">
    ➕ Ajouter un apport
  </button>

  <button class="btn-finance-moins"
          onclick="ajouterDepense()">
    ➖ Ajouter une dépense
  </button>

</div>
<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxqkwUh7KkIZeS_r4i3TZEoM5iELxuJCTsguqbZ-YeuJG0ELPwoLgoJV8okTQk82wc/exec";

async function chargerFinances(){

  const response = await fetch(API_URL);
  const data = await response.json();

  document.getElementById("totalAnnuel").textContent =
    data.totalAnnuel.toFixed(2) + " CHF";

  document.getElementById("totalMensuel").textContent =
    data.totalMensuel.toFixed(2) + " CHF";

  document.getElementById("soldeVacances").textContent =
    data.soldeVacances.toFixed(2) + " CHF";

  document.getElementById("totalApports").textContent =
    data.totalApports.toFixed(2) + " CHF";

  document.getElementById("totalDepenses").textContent =
    data.totalDepenses.toFixed(2) + " CHF";
}

chargerFinances();
function ajouterApport(){

  financeType = "Apport";

  document.getElementById(
    "financeModalTitle"
  ).textContent = "➕ Ajouter un apport";

  document.getElementById(
    "financeMontant"
  ).value = "";

  document.getElementById(
    "financeCommentaire"
  ).value = "";

  document.getElementById(
    "financeModal"
  ).classList.add("show");
}

function ajouterDepense(){

  financeType = "Dépense";

  document.getElementById(
    "financeModalTitle"
  ).textContent = "➖ Ajouter une dépense";

  document.getElementById(
    "financeMontant"
  ).value = "";

  document.getElementById(
    "financeCommentaire"
  ).value = "";

  document.getElementById(
    "financeModal"
  ).classList.add("show");
}
function closeFinanceModal(){

  document.getElementById(
    "financeModal"
  ).classList.remove("show");

}
    async function validerFinance(){

  const montant =
    Number(
      document.getElementById(
        "financeMontant"
      ).value
    );

  const commentaire =
    document.getElementById(
      "financeCommentaire"
    ).value;

  if(!montant) return;

  let valeur = montant;

  if(financeType === "Dépense"){
    valeur = -Math.abs(montant);
  }

  await envoyerMouvement(
    financeType,
    valeur,
    commentaire
  );

  closeFinanceModal();

  chargerFinances();
}
async function envoyerMouvement(
  type,
  montant,
  commentaire
){

  const response = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      type,
      montant,
      commentaire
    })
  });

  const result = await response.json();

  if(result.success){
    alert("✅ Mouvement enregistré");
  }

  chargerFinances();
}

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      type,
      montant,
      commentaire
    })
  });

  chargerFinances();

}
</script>
   <div id="financeModal" class="modal-overlay">

  <div class="modal">

    <h3 id="financeModalTitle">
      Ajouter un mouvement
    </h3>

    <div style="margin-top:15px">

      <input
        type="number"
        id="financeMontant"
        placeholder="Montant CHF">

      <br><br>

      <input
        type="text"
        id="financeCommentaire"
        placeholder="Commentaire">

      <br><br>

     <button
  class="btn-modal-valider"
  onclick="validerFinance()">
        ✅ Valider
      </button>

    <button
  class="btn-modal-annuler"
        style="
          width:100%;
          margin-top:8px;
          background:#ddd;
          color:#333;"
        onclick="closeFinanceModal()">
        Annuler
      </button>

    </div>

  </div>

</div> 
</body>
</html>
